<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaTrader Bridge</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 16px;
        width: 280px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px 0;
      }
      button {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: none;
        background: #1967d2;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled {
        background: #9bb8e5;
        cursor: not-allowed;
      }
      .status {
        font-size: 12px;
        margin-top: 8px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h1>MetaTrader Bridge</h1>
    <div>Send the current page summary to your local MetaTrader bridge.</div>
    <button id="send">Send to MetaTrader</button>
    <div class="status" id="status">Status: checking...</div>
    <script src="popup.js"></script>
  </body>
</html>
